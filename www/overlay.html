<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Saywell overlay</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font: 600 13px/1 "Inter", "Segoe UI", system-ui, sans-serif; user-select: none; }
    .pill { position: absolute; inset: 8px 10px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 999px;
      background: rgba(14, 16, 32, .92); color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08);
      opacity: 0; transform: translateY(6px); transition: opacity .15s ease-out, transform .15s ease-out; }
    .pill.on { opacity: 1; transform: none; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #FF6B57; flex: none; }
    .recording .dot { animation: pulse 1.1s ease-in-out infinite; }
    .processing .dot { background: #6D5EF5; animation: spin 0.9s linear infinite; border-radius: 3px; }
    .copied .dot, .done .dot { background: #2BD9A4; }
    .error .dot { background: #FFB020; }
    .time { margin-left: auto; font-variant-numeric: tabular-nums; color: #b9bdd6; font-weight: 500; }
    img { width: 20px; height: 20px; flex: none; }
    @keyframes pulse { 50% { transform: scale(.6); opacity: .6; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
  </style>
</head>
<body>
  <div class="pill" id="pill"><img src="assets/logo.svg" alt=""><span class="dot"></span><span id="text">Listening…</span><span class="time" id="time"></span></div>
  <script type="module" src="js/overlay.js"></script>
</body>
</html>
